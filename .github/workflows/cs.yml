name: php-cs-fixer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cs-fixer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
