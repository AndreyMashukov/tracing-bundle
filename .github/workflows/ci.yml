name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: vendor/bin/phpunit --colors=always

  ai-trace-audit:
    name: AI-trace audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files
        run: |
          if grep -rEi 'claude|anthropic|opus|sonnet|co-authored-by|generated with|assistant' \
              --exclude-dir=.git \
              --exclude=ci.yml \
              --exclude=pre-commit \
              --exclude=commit-msg \
              .; then
            echo "FATAL: AI traces found in tracked files"
            exit 1
          fi
      - name: Scan commit messages
        run: |
          if git log --format='%B' | grep -Ei 'claude|anthropic|opus|sonnet|co-authored-by|generated with|assistant'; then
            echo "FATAL: AI traces in commit history"
            exit 1
          fi
      - name: Verify author identity
        run: |
          authors=$(git log --format='%ae' | sort -u)
          if [ "$authors" != "a.mashukoff@gmail.com" ]; then
            echo "FATAL: unexpected author(s): $authors"
            exit 1
          fi
